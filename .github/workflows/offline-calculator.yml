name: Offline Calculator Tests
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/browser-calculator.test.cjs'
      - '.github/workflows/offline-calculator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-calculator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/browser-calculator.test.cjs
